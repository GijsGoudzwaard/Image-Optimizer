<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- The app's own copy of the one icon the folder button needs, bundled for
       the same reason the status icons are: the two icon themes this ships
       against do not agree on which names exist, and a missing one paints a
       placeholder rather than saying so.

       Named -symbolic and reached by name rather than by resource path, so GTK
       recolours it with whatever the stylesheet says: white on the purple bar of
       the image list, and the theme's own colour on the welcome screen.

       The comment sits inside the element on purpose. Four lines of XML in front
       of it once broke gdk-pixbuf's format sniffing, which painted the icon as a
       missing icon placeholder. -->
  <path d="M1.5 3.5a1 1 0 0 1 1-1h3.2l1.2 1.4h5.6a1 1 0 0 1 1 1v1.1h-12z" fill="#000000"/>
  <path d="M1.4 7.2h13.2l-1.5 5.4a1 1 0 0 1-1 .7H2.6a1 1 0 0 1-1-.8z" fill="#000000"/>
</svg>
