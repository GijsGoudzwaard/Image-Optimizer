name: image-optimizer
base: core24
# title, version, summary, description, license, contact, issues, source-code,
# website and donation are all deliberately absent: parse-info below adopts them
# from the MetaInfo file, which makes that file the single source of truth for
# both this store and Flathub. Spelling any of them out here would silently win
# over the adopted value and let the two listings drift apart again.
adopt-info: image-optimizer
grade: stable
confinement: strict
# The one piece of listing metadata that is not adopted: the MetaInfo file names
# no <icon>, so the Snap Store would have nothing to show without this path.
icon: data/icons/128/com.github.gijsgoudzwaard.image-optimizer.svg

platforms:
  amd64:
  arm64:

parts:
  image-optimizer:
    plugin: meson
    source: .
    meson-parameters:
      - --prefix=/usr
      - --buildtype=release
    # The version comes out of the MetaInfo release list, so a release only has
    # to be bumped in meson.build and the MetaInfo file, not here as well.
    parse-info:
      - usr/share/metainfo/com.github.gijsgoudzwaard.image-optimizer.appdata.xml
    build-packages:
      # meson and ninja are listed on purpose instead of being taken from the
      # gnome extension's SDK snap. That snap happens to carry them on amd64 but
      # not on arm64, which failed the arm64 build with "'meson' not found"
      # before it even started pulling.
      - meson
      - ninja-build
      # meson.build ends in gnome.post_install (), which needs
      # update-desktop-database from desktop-file-utils.
      - desktop-file-utils
      - gettext
      - libglib2.0-dev
      # xmllint, which glib-compile-resources shells out to for the
      # xml-stripblanks on every icon in the gresource. Nothing else here pulls
      # it in: with only the other packages the build stops at "xml-stripblanks
      # preprocessing requested, but XMLLINT is not set, and xmllint is not in
      # PATH". It has been coming from the gnome extension's SDK by luck rather
      # than by agreement.
      - libxml2-utils
      - valac
    # No stage-packages. The tool the app shells out to is built by the part
    # below and carries its own libpng, zlib, mozjpeg and zopfli, so there is
    # nothing to pull from the archive. GTK4 and GLib come from the gnome
    # extension's content snap.

  # Efficient Compression Tool, the one thing the app shells out to. It handles
  # both PNG and JPEG, which is why there is one part here where there used to be
  # two stage-packages: measured over ten images, PNG went from 10.55% to 17.59%
  # and JPEG from 3.32% to 5.85%, and the PNG side got faster rather than slower.
  #
  # From a pinned commit rather than a release tarball, because libpng and
  # mozjpeg are git submodules and the tarball GitHub generates for a tag does
  # not contain them. The commit is what the v0.9.5 tag points at.
  ect:
    plugin: cmake
    source: https://github.com/fhanau/Efficient-Compression-Tool.git
    source-type: git
    source-commit: 9aabc23d73899ae55c1de292592fed6eb6217f66
    source-subdir: src
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      # Explicit, so the binary lands in $SNAP/usr/bin next to the app itself
      # instead of in $SNAP/bin, which is a second place to have to think about.
      # The cmake plugin sets no prefix of its own, on purpose.
      - -DCMAKE_INSTALL_PREFIX=/usr
    build-packages:
      # Only nasm, for the x86 assembly in mozjpeg's SIMD code: the cmake plugin
      # brings gcc and cmake itself. Harmless on arm64, where the NEON path needs
      # no assembler and the package exists all the same.
      - nasm

slots:
  # GtkApplication claims this well known name on the session bus. Without the
  # slot, snapd's D-Bus mediation refuses it.
  dbus-svc:
    interface: dbus
    bus: session
    name: com.github.gijsgoudzwaard.image-optimizer

apps:
  image-optimizer:
    command: usr/bin/com.github.gijsgoudzwaard.image-optimizer
    extensions: [gnome]
    common-id: com.github.gijsgoudzwaard.image-optimizer
    plugs:
      - home
    slots:
      - dbus-svc
