# This is the same ID that you've used in meson.build and other files
app-id: com.github.gijsgoudzwaard.image-optimizer

# Instead of manually specifying a long list of build and runtime dependencies,
# we can use a convenient pre-made runtime and SDK. For this example, we'll be
# using the runtime and SDK provided by elementary.
runtime: io.elementary.Platform
runtime-version: '8'
sdk: io.elementary.Sdk

# This should match the exec line in your .desktop file and usually is the same
# as your app ID
command: com.github.gijsgoudzwaard.image-optimizer

# Every permission here has to earn its place, because each one shows up on the
# app's Flathub listing. There is deliberately no --filesystem argument: files
# reach the app through the portals instead, and all three routes hand over a
# path in this app's own document namespace, which is the one file the user
# pointed at and nothing around it.
#
#   file chooser   Gtk.FileDialog, which GTK routes through the portal
#   drag and drop  GDK speaks org.freedesktop.portal.FileTransfer by itself
#   Open With      flatpak rewrites the %F in the desktop file into its own file
#                  forwarding tokens when it exports the launcher, so this needs
#                  nothing here and nothing in the desktop file
finish-args:
  # Shared memory with the X server. Without it X11 falls back to copying every
  # frame over the socket, which is visibly slow.
  - '--share=ipc'
  # Only claimed when the session is actually X11, so a Wayland session gets no
  # X11 access at all.
  - '--socket=fallback-x11'
  # The primary display path.
  - '--socket=wayland'
  # Access to /dev/dri, which is what EGL and Vulkan need to find a driver.
  # Without it GTK reports "Failed to create EGL display" and
  # "VK_ERROR_INCOMPATIBLE_DRIVER", drops to its software renderer and draws
  # every frame and every glyph on the CPU. This is the standard GPU permission
  # and is not one of the ones Flathub counts against the risk rating: it grants
  # the render node and nothing else, unlike --device=all.
  - '--device=dri'

# This section is where you list all the source code required to build your app.
# If we had external dependencies that weren't included in our SDK, we would list
# them here.
modules:
  # Efficient Compression Tool, the one thing the app shells out to. It handles
  # both PNG and JPEG, which is why there is one module here where there used to
  # be two: measured over ten images, PNG went from 10.55% to 17.59% and JPEG
  # from 3.32% to 5.85%, and the PNG side got faster rather than slower.
  #
  # A pinned commit and not a tarball, because libpng and mozjpeg are git
  # submodules of it and the tarball GitHub generates for a tag does not contain
  # them. The commit is the one the v0.9.5 tag points at; measured against
  # master, that tag gives the same result on eight of ten test images and is
  # within seven bytes on the other two.
  #
  # It brings its own libpng, zlib, mozjpeg and zopfli, so nothing here links
  # against the runtime's copies and there is no second module to keep in step.
  # The other side of that is that their updates arrive when this commit moves.
  - name: ect
    buildsystem: cmake-ninja
    subdir: src
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/fhanau/Efficient-Compression-Tool.git
        tag: v0.9.5
        commit: 9aabc23d73899ae55c1de292592fed6eb6217f66

  - name: image-optimizer
    buildsystem: meson
    sources:
      - type: dir
        path: .
