name: CI

on: [push]

jobs:
  flatpak:
    name: Flatpak
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        arch: [x86_64, aarch64]
      # Don't fail the whole workflow if one architecture fails
      fail-fast: false

    container:
      image: ghcr.io/elementary/flatpak-platform/runtime:8-${{ matrix.arch }}
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No QEMU setup step: every step of this job already runs inside the
      # aarch64 container, so the runner has binfmt emulation working before
      # the first step starts. docker/setup-qemu-action cannot run here
      # anyway, it shells out to the docker CLI and the container has none.

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: reco.flatpak
          manifest-path: com.github.gijsgoudzwaard.image-optimizer.yml
          run-tests: true
          repository-name: appcenter
          repository-url: https://flatpak.elementary.io/repo.flatpakrepo
          cache-key: "flatpak-builder-${{ github.sha }}"
          arch: ${{ matrix.arch }}

  lint:
    name: Lint
    runs-on: ubuntu-22.04

    container:
      image: valalang/lint

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint
        run: io.elementary.vala-lint -d .
