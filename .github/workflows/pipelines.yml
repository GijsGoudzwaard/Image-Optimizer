name: CI

on: [push]

jobs:
  flatpak:
    name: Flatpak
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
      # Don't fail the whole workflow if one architecture fails
      fail-fast: false

    container:
      image: ghcr.io/elementary/flatpak-platform/runtime:8-${{ matrix.arch }}
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Each architecture builds on a runner of its own architecture, so there
      # is no QEMU to set up. That is deliberate: docker/setup-qemu-action used
      # to install a capable QEMU here, but it shells out to the docker CLI and
      # this container has neither docker nor a package manager to add one. The
      # runner's own binfmt is enough to start an emulated container but not to
      # build in it, which is why the emulated aarch64 build failed.

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: reco.flatpak
          manifest-path: com.github.gijsgoudzwaard.image-optimizer.yml
          run-tests: true
          repository-name: appcenter
          repository-url: https://flatpak.elementary.io/repo.flatpakrepo
          cache-key: "flatpak-builder-${{ github.sha }}"
          arch: ${{ matrix.arch }}

  lint:
    name: Lint
    runs-on: ubuntu-22.04

    container:
      image: valalang/lint

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint
        run: io.elementary.vala-lint -d .
