name: CI

on: [push]

permissions:
  contents: read

jobs:
  flatpak:
    name: Flatpak
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
      # Don't fail the whole workflow if one architecture fails
      fail-fast: false

    container:
      image: ghcr.io/elementary/flatpak-platform/runtime:8-${{ matrix.arch }}
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Each architecture builds on a runner of its own architecture, so there
      # is no QEMU to set up. That is deliberate: docker/setup-qemu-action used
      # to install a capable QEMU here, but it shells out to the docker CLI and
      # this container has neither docker nor a package manager to add one. The
      # runner's own binfmt is enough to start an emulated container but not to
      # build in it, which is why the emulated aarch64 build failed.

      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: com.github.gijsgoudzwaard.image-optimizer.flatpak
          manifest-path: com.github.gijsgoudzwaard.image-optimizer.yml
          run-tests: true
          repository-name: appcenter
          repository-url: https://flatpak.elementary.io/repo.flatpakrepo
          cache-key: "flatpak-builder-${{ github.sha }}"
          arch: ${{ matrix.arch }}

  snap:
    name: Snap
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
      # Don't fail the whole workflow if one architecture fails
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Until this job existed the snap was only ever built on Launchpad, after
      # a merge. That is how an arm64 build that could not find meson reached
      # master while amd64 was green.
      - name: Build
        id: build
        uses: snapcore/action-build@v1

      - name: Upload the snap
        uses: actions/upload-artifact@v7
        with:
          name: snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}

  smoke:
    name: Smoke test
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
      # Don't fail the whole workflow if one architecture fails
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Ubuntu 24.04 on purpose: it is the base of core24, so this is the same
      # dependency set the snap builds against.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream \
            build-essential \
            cmake \
            dbus \
            desktop-file-utils \
            gettext \
            libglib2.0-dev \
            libgtk-4-bin \
            libgtk-4-dev \
            meson \
            nasm \
            ninja-build \
            pkg-config \
            util-linux \
            valac \
            xdotool \
            xvfb

      # The optimizer the app shells out to. It is not packaged for Ubuntu, and
      # its libpng and mozjpeg are git submodules, so the tarball for a tag is
      # not enough: this builds the same pinned commit the flatpak manifest and
      # snapcraft.yaml build, and those three are the only places the commit
      # appears. nasm above is for the x86 assembly in mozjpeg's SIMD code.
      - name: Build the optimizer the app runs
        run: |
          git clone https://github.com/fhanau/Efficient-Compression-Tool ect
          cd ect
          git checkout 9aabc23d73899ae55c1de292592fed6eb6217f66
          git submodule update --init --recursive
          cmake -S src -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          sudo cmake --install build
          ect | head -3

      - name: Build
        run: |
          meson setup build --prefix=/usr --buildtype=release
          ninja -C build

      - name: Validate desktop and metainfo files
        run: meson test -C build --print-errorlogs

      - name: Install into a staging tree
        run: DESTDIR="$PWD/dest" ninja -C build install

      # Compiling is not enough. The GTK4 port of the image list once built with
      # zero errors while the list never refreshed at all.
      - name: Run the app headless and check it optimizes
        run: .github/scripts/smoke-test.sh dest/usr/bin/com.github.gijsgoudzwaard.image-optimizer

      # Covers what has actually broken before: awkward filenames, unreadable
      # files, whole batches being skipped, and parallel output drifting from
      # sequential. Pins to one core with taskset for the single core case.
      - name: Run the regression suite
        run: .github/scripts/regression-test.sh dest/usr/bin/com.github.gijsgoudzwaard.image-optimizer

  lint:
    name: Lint
    runs-on: ubuntu-24.04

    container:
      # Pinned by digest because there is nothing else to pin to: valalang/lint
      # publishes a single moving "latest" and no version tags at all. On
      # 2026-09-04 a new one turned `using` into an error, which turned this job
      # red three weeks after the last commit to this repo.
      #
      # To take in newer rules, deliberately, replace the digest with what this
      # prints and then fix whatever it finds:
      #
      #   curl -s https://hub.docker.com/v2/repositories/valalang/lint/tags \
      #     | python3 -c "import json,sys; print(json.load(sys.stdin)['results'][0]['digest'])"
      image: valalang/lint@sha256:144a55cf6ff94ca4d58b38aa62990421d170313b3e8ef0ed2b9802644c3c07db

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint
        run: io.elementary.vala-lint -d .
